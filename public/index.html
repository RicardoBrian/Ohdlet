<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관산중학교 정보 게시판</title>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
  <style>
    /* ── 변수 & 리셋 ── */
    :root {
      --primary: #6c8ef7;
      --primary2: #a78bfa;
      --bg1: #dce8ff;
      --bg2: #e9d8fd;
      --bg3: #d1fae5;
      --text: #1e293b;
      --sub: #64748b;
      --glass: rgba(255,255,255,0.35);
      --glass-hover: rgba(255,255,255,0.55);
      --glass-border: rgba(255,255,255,0.6);
      --glass-shadow: 0 8px 32px rgba(100,120,220,0.12);
      --card-bg: rgba(255,255,255,0.28);
      --input-bg: rgba(255,255,255,0.5);
      --radius: 20px;
      --radius-sm: 12px;
    }
    body.dark {
      --bg1: #0f172a;
      --bg2: #1e1b4b;
      --bg3: #064e3b;
      --text: #e2e8f0;
      --sub: #94a3b8;
      --glass: rgba(255,255,255,0.06);
      --glass-hover: rgba(255,255,255,0.12);
      --glass-border: rgba(255,255,255,0.12);
      --glass-shadow: 0 8px 32px rgba(0,0,0,0.4);
      --card-bg: rgba(255,255,255,0.05);
      --input-bg: rgba(255,255,255,0.08);
      --primary: #818cf8;
      --primary2: #c084fc;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Gowun Dodum', sans-serif;
      color: var(--text);
      min-height: 100vh;
      transition: background 0.4s, color 0.4s;
      overflow-x: hidden;
    }

    /* ── 배경 블롭 ── */
    .blob-wrap { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.55;
      animation: blobFloat 18s ease-in-out infinite;
    }
    .blob:nth-child(1) { width: 500px; height: 500px; background: var(--bg1); top: -100px; left: -100px; animation-delay: 0s; }
    .blob:nth-child(2) { width: 400px; height: 400px; background: var(--bg2); top: 30%; right: -80px; animation-delay: -6s; }
    .blob:nth-child(3) { width: 350px; height: 350px; background: var(--bg3); bottom: -80px; left: 30%; animation-delay: -12s; }
    @keyframes blobFloat {
      0%,100% { transform: translate(0,0) scale(1); }
      33% { transform: translate(40px,-40px) scale(1.08); }
      66% { transform: translate(-30px,30px) scale(0.95); }
    }

    /* ── 글래스 베이스 ── */
    .glass {
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.4);
    }
    body.dark .glass { box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.08); }

    /* ── 레이아웃 ── */
    #app { position: relative; z-index: 1; }
    .container { max-width: 1300px; margin: 0 auto; padding: 20px; }
    .hidden { display: none !important; }

    /* ── 상단 네비 ── */
    .top-nav {
      position: sticky; top: 0; z-index: 200;
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 28px; margin-bottom: 28px;
    }
    .nav-left, .nav-right { display: flex; align-items: center; gap: 10px; }

    /* ── 버튼 공통 ── */
    .btn {
      border: 1px solid var(--glass-border); background: var(--glass);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      color: var(--text); border-radius: 50px; padding: 8px 18px;
      font-family: inherit; font-size: 0.88rem; font-weight: 700;
      cursor: pointer; transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    }
    .btn:hover { background: var(--glass-hover); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.1); }
    .btn.primary {
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      border-color: transparent; color: white;
      box-shadow: 0 4px 15px rgba(108,142,247,0.35);
    }
    .btn.primary:hover { box-shadow: 0 6px 20px rgba(108,142,247,0.5); }
    .btn.danger { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.3); color: #ef4444; }
    .btn.danger:hover { background: rgba(239,68,68,0.25); }
    .btn.full { width: 100%; border-radius: var(--radius-sm); padding: 14px; font-size: 1.1rem; }

    /* ── 언어 버튼 ── */
    .lang-btn { padding: 6px 14px; border-radius: 50px; font-size: 0.82rem; }
    .lang-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      border-color: transparent; color: white;
    }

    /* ── 다크모드 토글 ── */
    .dark-toggle {
      width: 46px; height: 26px; border-radius: 50px;
      background: var(--glass); border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px); cursor: pointer;
      position: relative; transition: 0.3s;
    }
    .dark-toggle::after {
      content: ''; position: absolute; top: 3px; left: 3px;
      width: 18px; height: 18px; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      transition: transform 0.3s;
    }
    body.dark .dark-toggle::after { transform: translateX(20px); }

    /* ── 스텝1: 선택 카드 ── */
    .select-card { max-width: 480px; margin: 60px auto; padding: 40px; border-radius: 28px; }
    .select-card h1 { font-size: 1.9rem; font-weight: 800; text-align: center; margin-bottom: 28px; background: linear-gradient(135deg, var(--primary), var(--primary2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 0.82rem; font-weight: 700; color: var(--sub); margin-bottom: 6px; letter-spacing: 0.05em; text-transform: uppercase; }
    .glass-select, .glass-input, .glass-textarea {
      width: 100%; padding: 12px 16px; border-radius: var(--radius-sm);
      background: var(--input-bg); border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px); color: var(--text);
      font-family: inherit; font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    .glass-select:focus, .glass-input:focus, .glass-textarea:focus {
      border-color: var(--primary); box-shadow: 0 0 0 3px rgba(108,142,247,0.2);
    }
    .glass-textarea { resize: vertical; min-height: 80px; }

    /* ── 게시판 헤더 ── */
    .board-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .board-title { font-size: 2.2rem; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--primary2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1.2; }
    .board-desc { font-size: 1.1rem; color: var(--sub); margin-top: 6px; }

    /* ── 검색바 ── */
    .search-wrap { position: relative; margin-bottom: 20px; }
    .search-wrap .glass-input { padding-left: 44px; border-radius: 50px; }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 1.1rem; opacity: 0.5; }

    /* ── 폼 카드 ── */
    .form-card { max-width: 700px; margin: 0 auto 28px; padding: 28px; border-radius: 28px; }
    .form-row { display: grid; grid-template-columns: 80px 1fr 110px; gap: 10px; margin-bottom: 12px; }

    /* ── 이미지 업로드 ── */
    .upload-box {
      border: 2px dashed rgba(108,142,247,0.4); border-radius: var(--radius);
      padding: 18px; text-align: center; cursor: pointer; color: var(--sub);
      background: rgba(108,142,247,0.05); transition: 0.2s; margin-bottom: 14px;
    }
    .upload-box:hover { border-color: var(--primary); background: rgba(108,142,247,0.12); color: var(--primary); }
    .preview-container { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
    .preview-item { position: relative; width: 56px; height: 56px; }
    .preview-item img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
    .preview-item .del-btn { position: absolute; top: -6px; right: -6px; background: #ef4444; color: white; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; cursor: pointer; }

    /* ── 마소닉 그리드 ── */
    .grid-board { column-count: 4; column-gap: 18px; margin-top: 10px; }
    @media (max-width: 1200px) { .grid-board { column-count: 3; } }
    @media (max-width: 800px)  { .grid-board { column-count: 2; } }
    @media (max-width: 500px)  { .grid-board { column-count: 1; } }

    /* ── 포스트 카드 ── */
    .post-card {
      break-inside: avoid; page-break-inside: avoid;
      display: inline-block; width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.35);
      border-radius: var(--radius); padding: 22px;
      margin-bottom: 18px;
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s;
      opacity: 0; transform: translateY(24px);
    }
    .post-card.visible { opacity: 1; transform: translateY(0); }
    .post-card:hover { transform: translateY(-6px) scale(1.01); box-shadow: 0 20px 40px rgba(100,120,220,0.18), inset 0 1px 0 rgba(255,255,255,0.5); }
    body.dark .post-card { box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06); }

    /* 핀 카드 */
    .post-card.pinned-card {
      border-color: rgba(108,142,247,0.5);
      box-shadow: 0 0 0 2px rgba(108,142,247,0.25), var(--glass-shadow);
    }
    .pin-badge { font-size: 0.72rem; font-weight: 800; color: var(--primary); background: rgba(108,142,247,0.12); padding: 2px 8px; border-radius: 50px; margin-bottom: 8px; display: inline-block; }

    /* 선생님 카드 */
    .teacher-card {
      background: linear-gradient(135deg, rgba(108,142,247,0.7), rgba(167,139,250,0.7)) !important;
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border-color: rgba(255,255,255,0.4) !important;
      column-span: all; margin-bottom: 22px;
      color: white !important;
    }
    .teacher-card * { color: white !important; }
    .teacher-card .post-sub { font-size: 1.2rem !important; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 8px; margin-bottom: 10px; font-weight: 800; }

    .post-sub { font-size: 1.15rem; font-weight: 700; margin-bottom: 8px; line-height: 1.4; white-space: pre-wrap; word-break: break-all; }
    .post-msg { font-size: 1rem; opacity: 0.88; white-space: pre-wrap; word-break: break-all; }
    .post-msg a { color: var(--primary); text-decoration: underline; font-weight: 700; }

    /* ── 이미지 슬라이더 ── */
    .img-slider { position: relative; margin-top: 14px; border-radius: var(--radius-sm); overflow: hidden; }
    .slides-track { display: flex; transition: transform 0.35s cubic-bezier(0.4,0,0.2,1); }
    .slides-track img { width: 100%; flex-shrink: 0; aspect-ratio: 4/3; object-fit: cover; cursor: zoom-in; }
    .slider-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(0,0,0,0.35); backdrop-filter: blur(6px);
      border: none; color: white; font-size: 1.2rem; width: 32px; height: 32px;
      border-radius: 50%; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center;
    }
    .slider-btn:hover { background: rgba(0,0,0,0.6); }
    .slider-prev { left: 8px; }
    .slider-next { right: 8px; }
    .slider-dots { display: flex; justify-content: center; gap: 5px; padding: 8px 0 2px; }
    .s-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--sub); opacity: 0.4; cursor: pointer; transition: 0.2s; }
    .s-dot.active { opacity: 1; background: var(--primary); width: 18px; border-radius: 3px; }

    /* ── 포스트 메타 ── */
    .post-meta { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(0,0,0,0.06); margin-top: 14px; padding-top: 10px; font-size: 0.82rem; color: var(--sub); flex-wrap: wrap; gap: 6px; }
    body.dark .post-meta { border-top-color: rgba(255,255,255,0.08); }
    .like-area { display: flex; align-items: center; gap: 5px; cursor: pointer; padding: 4px 10px; border-radius: 50px; transition: 0.2s; user-select: none; }
    .like-area:hover { background: rgba(239,68,68,0.08); }
    .like-area.voted { color: #ef4444; }
    @keyframes heartBeat { 0%,100% { transform: scale(1); } 30% { transform: scale(1.45); } 60% { transform: scale(1.1); } }
    .like-area.animate { animation: heartBeat 0.4s ease; }
    .action-links { display: flex; gap: 10px; }
    .action-links a { font-weight: 700; cursor: pointer; color: var(--primary); text-decoration: none; transition: opacity 0.2s; }
    .action-links a:hover { opacity: 0.65; }
    .action-links .pin-link { color: var(--sub); }
    .action-links .pin-link.is-pinned { color: var(--primary); }
    .post-byline { font-size: 0.7rem; opacity: 0.5; text-align: right; margin-top: 8px; }

    /* ── 로딩 ── */
    #loadingOverlay { position: fixed; inset: 0; z-index: 9000; display: none; flex-direction: column; justify-content: center; align-items: center; background: rgba(255,255,255,0.6); backdrop-filter: blur(8px); }
    body.dark #loadingOverlay { background: rgba(0,0,0,0.5); }
    .spinner { width: 42px; height: 42px; border-radius: 50%; border: 4px solid rgba(108,142,247,0.2); border-top-color: var(--primary); animation: spin 0.8s linear infinite; margin-bottom: 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loadingText { font-weight: 700; color: var(--primary); }

    /* ── 이미지 모달 ── */
    .img-modal { position: fixed; inset: 0; z-index: 9500; display: none; justify-content: center; align-items: center; background: rgba(0,0,0,0.88); backdrop-filter: blur(8px); cursor: zoom-out; }
    .img-modal img { max-width: 90%; max-height: 90%; border-radius: var(--radius); box-shadow: 0 20px 60px rgba(0,0,0,0.5); }

    /* ── 공지 팝업 ── */
    .popup-overlay { position: fixed; inset: 0; z-index: 8000; display: none; justify-content: center; align-items: center; background: rgba(0,0,0,0.5); backdrop-filter: blur(6px); }
    .popup-overlay.show { display: flex; }
    .popup-box { max-width: 460px; width: 90%; padding: 36px; border-radius: 28px; text-align: center; }
    .popup-box h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 14px; background: linear-gradient(135deg, var(--primary), var(--primary2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .popup-msg { font-size: 1rem; line-height: 1.7; white-space: pre-wrap; word-break: break-all; margin-bottom: 24px; }

    /* ── 관리자 패널 ── */
    .admin-panel { padding: 28px; border-radius: 28px; margin-top: 20px; }
    .admin-panel h2 { font-size: 1.2rem; font-weight: 800; margin-bottom: 20px; }
    .edit-banner { background: rgba(108,142,247,0.12); border: 1px solid rgba(108,142,247,0.3); border-radius: var(--radius-sm); padding: 14px 18px; font-weight: 700; color: var(--primary); margin-bottom: 16px; }
    .checkbox-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: var(--input-bg); padding: 18px; border-radius: var(--radius-sm); border: 1px solid var(--glass-border); margin-bottom: 14px; }
    .checkbox-grid hr { grid-column: span 3; border: none; border-top: 1px solid var(--glass-border); }
    .checkbox-grid label { display: flex; align-items: center; gap: 6px; font-weight: 700; cursor: pointer; }
    .status-pill { border: 1px solid; border-radius: 50px; padding: 4px 12px; font-weight: 700; font-size: 0.82rem; cursor: pointer; outline: none; font-family: inherit; transition: 0.2s; }
    .status-pill.on { color: var(--primary); background: rgba(108,142,247,0.1); border-color: rgba(108,142,247,0.4); }
    .status-pill.off { color: #ef4444; background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3); }
    .admin-list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--input-bg); border: 1px solid var(--glass-border); border-radius: var(--radius-sm); margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }

    /* ── 반응형 ── */
    @media (max-width: 600px) {
      .form-row { grid-template-columns: 1fr 1fr; }
      .form-row > *:last-child { grid-column: span 2; }
      .board-title { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
<div class="blob-wrap" aria-hidden="true">
  <div class="blob"></div>
  <div class="blob"></div>
  <div class="blob"></div>
</div>

<div id="loadingOverlay"><div class="spinner"></div><div id="loadingText">처리 중...</div></div>
<div id="imageModal" class="img-modal" onclick="closeModal()"><img id="modalImg" src="" alt=""></div>

<!-- 공지 팝업 -->
<div id="popupOverlay" class="popup-overlay">
  <div class="popup-box glass">
    <h2>📢 공지사항</h2>
    <div id="popupMsg" class="popup-msg"></div>
    <button class="btn primary" onclick="closePopup()">확인</button>
  </div>
</div>

<div id="app">
  <!-- 네비 -->
  <nav class="top-nav glass">
    <div class="nav-left">
      <button class="btn lang-btn active" id="btn-ko" onclick="setLanguage('ko')">한</button>
      <button class="btn lang-btn" id="btn-zh" onclick="setLanguage('zh')">中</button>
      <button class="btn lang-btn" id="btn-ru" onclick="setLanguage('ru')">РУ</button>
    </div>
    <div class="nav-right">
      <button class="btn" onclick="goHome()">🏠 홈</button>
      <button class="btn" onclick="toggleAdmin()">⚙️ 관리</button>
      <button class="dark-toggle" onclick="toggleDark()" title="다크모드"></button>
    </div>
  </nav>

  <div class="container">
    <!-- 스텝 1 -->
    <div id="step1" class="select-card glass">
      <h1>관산중학교 정보 게시판</h1>
      <div class="field">
        <label>학년</label>
        <select class="glass-select" id="grade" onchange="updateClassList()">
          <option>1학년</option><option>2학년</option><option>3학년</option>
        </select>
      </div>
      <div class="field">
        <label>반</label>
        <select class="glass-select" id="group" onchange="updateClassList()">
          <option>1반</option><option>2반</option><option>3반</option><option>4반</option><option>5반</option>
        </select>
      </div>
      <div class="field" style="margin-bottom:28px;">
        <label>수업 선택</label>
        <select class="glass-select" id="classList"><option>수업을 선택하세요</option></select>
      </div>
      <button class="btn primary full" id="ui-enter-btn" onclick="startBoard()">입장하기</button>
    </div>

    <!-- 스텝 2 -->
    <div id="step2" class="hidden">
      <div class="board-header">
        <div>
          <div id="boardTitle" class="board-title"></div>
          <div id="boardDesc" class="board-desc"></div>
        </div>
        <button class="btn" onclick="manualRefresh()">🔄 새로고침</button>
      </div>

      <!-- 검색 -->
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="glass-input" id="searchInput" type="text" placeholder="게시물 검색..." oninput="filterPosts()">
      </div>

      <!-- 작성 폼 -->
      <div class="form-card glass">
        <form id="postForm" onsubmit="submitPost(event)">
          <input type="hidden" id="f_mode" value="add">
          <input type="hidden" id="f_postId">
          <input type="hidden" id="f_lang" value="ko">
          <input type="hidden" id="f_grade">
          <input type="hidden" id="f_group">
          <input type="hidden" id="f_class">
          <div class="form-row">
            <input class="glass-input" id="p_num" placeholder="번호" required>
            <input class="glass-input" id="p_name" placeholder="이름" required>
            <input class="glass-input" id="p_pw" type="password" placeholder="비번" required>
          </div>
          <input class="glass-input" id="p_sub" placeholder="제목" required style="margin-bottom:10px;">
          <textarea class="glass-textarea" id="p_msg" rows="4" placeholder="내용을 입력하세요" required style="margin-bottom:12px;"></textarea>
          <div class="upload-box" id="ui-upload-label" onclick="document.getElementById('fileInput').click()">
            📷 클립보드 붙여넣기(Ctrl+V) 또는 클릭하여 이미지 첨부 (최대 4장)
            <div id="previewArea" class="preview-container"></div>
          </div>
          <input type="file" id="fileInput" class="hidden" accept="image/*" multiple onchange="handleFiles(this.files)">
          <button id="subBtn" type="submit" class="btn primary full">게시물 등록</button>
          <button id="cancelEditBtn" type="button" class="btn full hidden" style="margin-top:10px;" onclick="cancelEdit()">수정 취소</button>
        </form>
      </div>

      <div id="display" class="grid-board"></div>
      <div style="text-align:center; margin: 32px 0;">
        <button class="btn" onclick="goHome()">🏠 처음 화면으로</button>
      </div>
    </div>

    <!-- 관리자 패널 -->
    <div id="adminPanel" class="admin-panel glass hidden">
      <h2>🛠 수업 관리 패널</h2>
      <div id="adm_edit_info" class="edit-banner hidden"></div>
      <input type="hidden" id="adm_row">
      <input type="hidden" id="adm_grade_hidden">
      <input type="hidden" id="adm_group_hidden">

      <div class="checkbox-grid" id="adm_target_area">
        <label><input type="checkbox" class="adm-g" value="1학년"> 1학년</label>
        <label><input type="checkbox" class="adm-g" value="2학년"> 2학년</label>
        <label><input type="checkbox" class="adm-g" value="3학년"> 3학년</label>
        <hr>
        <label><input type="checkbox" class="adm-b" value="1반"> 1반</label>
        <label><input type="checkbox" class="adm-b" value="2반"> 2반</label>
        <label><input type="checkbox" class="adm-b" value="3반"> 3반</label>
        <label><input type="checkbox" class="adm-b" value="4반"> 4반</label>
        <label><input type="checkbox" class="adm-b" value="5반"> 5반</label>
      </div>
      <input class="glass-input" id="adm_name" placeholder="수업명" style="margin-bottom:10px;">
      <textarea class="glass-textarea" id="adm_desc" rows="2" placeholder="수업 상세 설명" style="margin-bottom:10px;"></textarea>
      <textarea class="glass-textarea" id="adm_ex" rows="2" placeholder="선생님 안내 (게시판 최상단 고정)" style="margin-bottom:10px;"></textarea>
      <textarea class="glass-textarea" id="adm_popup" rows="2" placeholder="공지사항 팝업 메시지 (입장 시 팝업 표시, 비워두면 미표시)" style="margin-bottom:16px;"></textarea>

      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px;">
        <button class="btn primary" onclick="saveAdminClass()">저장 / 내용 반영</button>
        <button id="adm_cancel_btn" class="btn hidden" onclick="resetAdminForm()">작업 취소</button>
      </div>
      <hr style="border:none; border-top:1px solid var(--glass-border); margin-bottom:20px;">
      <div id="adminList"></div>
    </div>
  </div>
</div>

<script>
  // ── 상태 ──
  let currentLang = 'ko';
  let imgList = [];
  let currentPosts = [];
  let currentExample = '';
  const MASTER_PW = "9600";

  const uiText = {
    ko: { opt:"수업을 선택하세요", enter:"입장하기", upload:"📷 클립보드 붙여넣기(Ctrl+V) 또는 클릭하여 이미지 첨부", submit:"게시물 등록", edit_finish:"수정 완료", loading:"데이터 불러오는 중...", translating:"번역 중..." },
    zh: { opt:"请选择课程", enter:"进入", upload:"📷 粘贴或点击上传图片", submit:"发布", edit_finish:"完成修改", loading:"加载中...", translating:"翻译中..." },
    ru: { opt:"Выберите урок", enter:"Войти", upload:"📷 Вставьте или нажмите для загрузки фото", submit:"Опубликовать", edit_finish:"Изм.завершено", loading:"Загрузка...", translating:"Перевод..." }
  };

  // ── API ──
  async function callApi(fn, params) {
    const res = await fetch('/api', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fn, ...params }),
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || '서버 오류');
    return json.result;
  }

  // ── 다크모드 ──
  function toggleDark() {
    document.body.classList.toggle('dark');
    localStorage.setItem('dark', document.body.classList.contains('dark') ? '1' : '0');
  }
  if (localStorage.getItem('dark') === '1') document.body.classList.add('dark');

  // ── 로딩 ──
  function toggleLoading(show, text) {
    document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
    if (text) document.getElementById('loadingText').innerText = text;
  }

  // ── 모달 ──
  function openModal(src) { document.getElementById('modalImg').src = src; document.getElementById('imageModal').style.display = 'flex'; }
  function closeModal() { document.getElementById('imageModal').style.display = 'none'; }

  // ── 공지 팝업 ──
  function showPopup(msg) {
    if (!msg) return;
    const key = 'popup_' + document.getElementById('f_class').value + document.getElementById('f_grade').value + document.getElementById('f_group').value;
    if (sessionStorage.getItem(key)) return;
    sessionStorage.setItem(key, '1');
    document.getElementById('popupMsg').innerText = msg;
    document.getElementById('popupOverlay').classList.add('show');
  }
  function closePopup() { document.getElementById('popupOverlay').classList.remove('show'); }

  // ── 메시지 포맷 ──
  function formatMessage(text) {
    if (!text) return "";
    let safe = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    return safe.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  }

  // ── 언어 ──
  function setLanguage(lang) {
    const isRefresh = !document.getElementById('step2').classList.contains('hidden');
    if (isRefresh) toggleLoading(true, uiText[lang].translating);
    currentLang = lang;
    document.getElementById('f_lang').value = lang;
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.id === 'btn-' + lang));
    document.getElementById('ui-enter-btn').innerText = uiText[lang].enter;
    document.getElementById('ui-upload-label').firstChild.textContent = uiText[lang].upload;
    document.getElementById('subBtn').innerText = document.getElementById('f_mode').value === 'edit' ? uiText[lang].edit_finish : uiText[lang].submit;
    updateClassList();
    if (isRefresh) manualRefresh();
  }

  function updateClassList() {
    callApi('getInitData', { grade: document.getElementById('grade').value, group: document.getElementById('group').value })
      .then(data => {
        const sel = document.getElementById('classList');
        sel.innerHTML = `<option>${uiText[currentLang].opt}</option>`;
        (data.classList || []).forEach(c => sel.innerHTML += `<option>${c.name}</option>`);
      }).catch(() => {});
  }

  function goHome() {
    document.getElementById('step2').classList.add('hidden');
    document.getElementById('step1').classList.remove('hidden');
    document.getElementById('adminPanel').classList.add('hidden');
    cancelEdit(); window.scrollTo(0,0);
  }

  function toggleAdmin() {
    const pw = prompt("관리자 PW:");
    if (pw !== MASTER_PW) return;
    document.getElementById('adminPanel').classList.toggle('hidden');
    if (!document.getElementById('adminPanel').classList.contains('hidden')) {
      loadAdminList();
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
  }

  function startBoard() {
    const cls = document.getElementById('classList').value;
    if (cls.includes("선택")) return;
    toggleLoading(true, uiText[currentLang].loading);
    document.getElementById('f_grade').value = document.getElementById('grade').value;
    document.getElementById('f_group').value = document.getElementById('group').value;
    document.getElementById('f_class').value = cls;
    document.getElementById('step1').classList.add('hidden');
    document.getElementById('step2').classList.remove('hidden');
    manualRefresh();
  }

  function manualRefresh() {
    toggleLoading(true, uiText[currentLang].loading);
    callApi('getPosts', {
      classTitle: document.getElementById('f_class').value,
      grade: document.getElementById('f_grade').value,
      group: document.getElementById('f_group').value,
      targetLang: currentLang,
    }).then(data => {
      document.getElementById('boardTitle').innerText = data.title;
      document.getElementById('boardDesc').innerText = data.desc;
      currentPosts = data.posts;
      currentExample = data.example;
      render(data.example, data.posts);
      toggleLoading(false);
      if (data.popup) showPopup(data.popup);
    }).catch(() => toggleLoading(false));
  }

  // ── 검색 필터 ──
  function filterPosts() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    if (!q) { render(currentExample, currentPosts); return; }
    const filtered = currentPosts.filter(p =>
      (p.subject||'').toLowerCase().includes(q) ||
      (p.message||'').toLowerCase().includes(q) ||
      (p.name||'').toLowerCase().includes(q)
    );
    render(currentExample, filtered, true);
  }

  // ── 렌더 ──
  function render(ex, posts, isFiltered) {
    const display = document.getElementById('display');
    let html = '';
    if (ex && !isFiltered) {
      html += `<div class="post-card teacher-card visible"><div class="post-sub">📌 선생님 안내</div><div class="post-msg">${formatMessage(ex)}</div></div>`;
    }

    const colCount = window.innerWidth > 1200 ? 4 : window.innerWidth > 800 ? 3 : window.innerWidth > 500 ? 2 : 1;
    const columns = Array.from({ length: colCount }, () => []);
    posts.forEach((p, i) => columns[i % colCount].push(p));
    const sorted = columns.flat();

    sorted.forEach((p, i) => {
      const hasLiked = localStorage.getItem('voted_' + p.id);
      const sliderHtml = buildSlider(p.imgs, p.id);
      html += `<div class="post-card ${p.pinned ? 'pinned-card' : ''}" data-id="${p.id}">
        ${p.pinned ? '<span class="pin-badge">📌 고정됨</span>' : ''}
        <div class="post-sub">${p.subject}</div>
        <div class="post-msg">${formatMessage(p.message)}</div>
        ${sliderHtml}
        <div class="post-meta">
          <div class="like-area ${hasLiked ? 'voted' : ''}" onclick="toggleLikeUI('${p.id}', this)">
            <span style="font-size:1.1rem;">❤️</span>
            <span class="like-count" style="font-weight:800;">${p.likes}</span>
          </div>
          <div class="action-links">
            <a class="pin-link ${p.pinned ? 'is-pinned' : ''}" onclick="handlePinClick('${p.id}')">📌</a>
            <a onclick="handleEditClick('${p.id}')">수정</a>
            <a onclick="openDelete('${p.id}')" style="color:#ef4444;">삭제</a>
          </div>
        </div>
        <div class="post-byline">${p.name}(${p.num}) · ${p.time}</div>
      </div>`;
    });

    display.innerHTML = html;

    // 카드 등장 애니메이션
    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); } });
    }, { threshold: 0.08 });
    document.querySelectorAll('.post-card:not(.teacher-card):not(.visible)').forEach(c => observer.observe(c));
  }

  // ── 이미지 슬라이더 ──
  function buildSlider(imgs, postId) {
    if (!imgs || imgs.length === 0) return '';
    if (imgs.length === 1) {
      return `<div class="img-slider"><div class="slides-track"><img src="${imgs[0]}" onclick="openModal('${imgs[0]}')" loading="lazy"></div></div>`;
    }
    const slides = imgs.map(s => `<img src="${s}" onclick="openModal('${s}')" loading="lazy">`).join('');
    const dots = imgs.map((_, i) => `<span class="s-dot ${i===0?'active':''}" onclick="slideTo('${postId}',${i})"></span>`).join('');
    return `<div class="img-slider" id="slider_${postId}">
      <div class="slides-track" id="track_${postId}">${slides}</div>
      <button class="slider-btn slider-prev" onclick="slidePrev('${postId}',${imgs.length})">‹</button>
      <button class="slider-btn slider-next" onclick="slideNext('${postId}',${imgs.length})">›</button>
      <div class="slider-dots">${dots}</div>
    </div>`;
  }

  const sliderIndex = {};
  function slideTo(id, idx) {
    sliderIndex[id] = idx;
    const track = document.getElementById('track_' + id);
    if (!track) return;
    track.style.transform = `translateX(-${idx * 100}%)`;
    document.querySelectorAll(`#slider_${id} .s-dot`).forEach((d, i) => d.classList.toggle('active', i === idx));
  }
  function slideNext(id, len) { slideTo(id, ((sliderIndex[id]||0) + 1) % len); }
  function slidePrev(id, len) { slideTo(id, ((sliderIndex[id]||0) - 1 + len) % len); }

  // ── 좋아요 ──
  function toggleLikeUI(id, el) {
    const hasLiked = localStorage.getItem('voted_' + id);
    const countEl = el.querySelector('.like-count');
    let cur = parseInt(countEl.innerText);
    el.classList.add('animate');
    setTimeout(() => el.classList.remove('animate'), 400);
    if (hasLiked) {
      countEl.innerText = Math.max(0, cur - 1);
      el.classList.remove('voted');
      localStorage.removeItem('voted_' + id);
      callApi('toggleLike', { postId: id, isCancel: true }).catch(() => {});
    } else {
      countEl.innerText = cur + 1;
      el.classList.add('voted');
      localStorage.setItem('voted_' + id, 'true');
      callApi('toggleLike', { postId: id, isCancel: false }).catch(() => {});
    }
  }

  // ── 핀 ──
  function handlePinClick(postId) {
    const pw = prompt("관리자 비밀번호:");
    if (pw !== MASTER_PW) return;
    const post = currentPosts.find(p => p.id === postId);
    if (!post) return;
    const isPinned = !post.pinned;
    callApi('togglePin', { pw: MASTER_PW, postId, isPinned }).then(() => {
      post.pinned = isPinned;
      render(currentExample, currentPosts);
    }).catch(err => alert(err.message));
  }

  // ── 이미지 처리 ──
  function handleFiles(files) {
    Array.from(files).forEach(file => {
      if (imgList.length >= 4) return;
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const max = 500; let w = img.width, h = img.height;
          if (w > max || h > max) { if (w > h) { h *= max/w; w = max; } else { w *= max/h; h = max; } }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          imgList.push(canvas.toDataURL('image/jpeg', 0.6));
          updatePreview();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }
  function updatePreview() {
    document.getElementById('previewArea').innerHTML = imgList.map((s, i) =>
      `<div class="preview-item"><img src="${s}"><button type="button" class="del-btn" onclick="removeImg(${i})">×</button></div>`
    ).join('');
  }
  function removeImg(i) { imgList.splice(i, 1); updatePreview(); }
  window.addEventListener('paste', e => {
    if (document.getElementById('step2').classList.contains('hidden')) return;
    const items = (e.clipboardData || e.originalEvent.clipboardData).items;
    for (let item of items) { if (item.type.startsWith('image/')) handleFiles([item.getAsFile()]); }
  });

  // ── 폼 제출 ──
  function submitPost(event) {
    event.preventDefault();
    toggleLoading(true, "게시물 저장 및 자동 번역 중...");
    document.getElementById('subBtn').disabled = true;
    const params = {
      mode: document.getElementById('f_mode').value,
      postId: document.getElementById('f_postId').value,
      targetLang: currentLang,
      grade: document.getElementById('f_grade').value,
      group: document.getElementById('f_group').value,
      classTitle: document.getElementById('f_class').value,
      num: document.getElementById('p_num').value,
      name: document.getElementById('p_name').value,
      password: document.getElementById('p_pw').value,
      subject: document.getElementById('p_sub').value,
      message: document.getElementById('p_msg').value,
      combinedImageData: imgList.join('|'),
    };
    callApi('processForm', params).then(data => {
      currentPosts = data.posts; currentExample = data.example;
      render(data.example, data.posts);
      document.getElementById('postForm').reset();
      cancelEdit(); toggleLoading(false);
    }).catch(err => { alert(err.message); document.getElementById('subBtn').disabled = false; toggleLoading(false); });
  }

  function handleEditClick(postId) {
    const post = currentPosts.find(p => p.id === postId);
    if (!post) return;
    const pw = prompt("비밀번호를 입력하세요:");
    if (!pw) return;
    document.getElementById('f_mode').value = 'edit';
    document.getElementById('f_postId').value = post.id;
    document.getElementById('p_name').value = post.name;
    document.getElementById('p_num').value = post.num;
    document.getElementById('p_sub').value = post.origSub;
    document.getElementById('p_msg').value = post.origMsg;
    document.getElementById('p_pw').value = pw;
    imgList = post.origImgs ? post.origImgs.split('|') : [];
    updatePreview();
    document.getElementById('subBtn').innerText = uiText[currentLang].edit_finish;
    document.getElementById('cancelEditBtn').classList.remove('hidden');
    window.scrollTo({ top: document.querySelector('.form-card').offsetTop - 80, behavior: 'smooth' });
  }

  function cancelEdit() {
    document.getElementById('postForm').reset();
    document.getElementById('f_mode').value = 'add';
    document.getElementById('f_postId').value = '';
    imgList = []; updatePreview();
    document.getElementById('subBtn').innerText = uiText[currentLang].submit;
    document.getElementById('subBtn').disabled = false;
    document.getElementById('cancelEditBtn').classList.add('hidden');
  }

  function openDelete(id) {
    const pw = prompt("비밀번호:");
    if (!pw) return;
    toggleLoading(true);
    callApi('processForm', {
      mode: "delete", postId: id, password: pw,
      classTitle: document.getElementById('f_class').value,
      grade: document.getElementById('f_grade').value,
      group: document.getElementById('f_group').value,
      targetLang: currentLang,
    }).then(data => {
      currentPosts = data.posts; currentExample = data.example;
      render(data.example, data.posts); toggleLoading(false);
    }).catch(err => { alert(err.message); toggleLoading(false); });
  }

  // ── 관리자 패널 ──
  function loadAdminList() {
    callApi('getSettingsList', { pw: MASTER_PW }).then(list => {
      document.getElementById('adminList').innerHTML = list.map(c => `
        <div class="admin-list-item">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <select onchange="toggleClassStatus(${c.row}, this.value)" class="status-pill ${c.status==='ON'?'on':'off'}">
              <option value="ON" ${c.status==='ON'?'selected':''}>ON</option>
              <option value="OFF" ${c.status==='OFF'?'selected':''}>OFF</option>
            </select>
            <span style="font-size:0.95rem;">${c.grade} ${c.group} — <b>${c.name}</b></span>
          </div>
          <div style="display:flex;gap:12px;">
            <a onclick='editAdminUI(${JSON.stringify(c)})' style="font-weight:700;color:var(--primary);cursor:pointer;">수정</a>
            <a onclick="delAdminClass(${c.row})" style="color:#ef4444;font-weight:700;cursor:pointer;">삭제</a>
          </div>
        </div>`).join('');
    }).catch(() => {});
  }

  function toggleClassStatus(row, status) {
    toggleLoading(true, "상태 변경 중...");
    callApi('updateClassStatus', { pw: MASTER_PW, row, newStatus: status }).then(() => {
      loadAdminList(); updateClassList(); toggleLoading(false);
    }).catch(() => toggleLoading(false));
  }

  function editAdminUI(c) {
    document.getElementById('adm_row').value = c.row;
    document.getElementById('adm_grade_hidden').value = c.grade;
    document.getElementById('adm_group_hidden').value = c.group;
    document.getElementById('adm_name').value = c.name;
    document.getElementById('adm_desc').value = c.desc;
    document.getElementById('adm_ex').value = c.ex;
    document.getElementById('adm_popup').value = c.popup || '';
    document.getElementById('adm_target_area').classList.add('hidden');
    const info = document.getElementById('adm_edit_info');
    info.classList.remove('hidden');
    info.innerText = `✏️ 수정 중: [${c.grade} ${c.group}] ${c.name}`;
    document.getElementById('adm_cancel_btn').classList.remove('hidden');
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }

  function saveAdminClass() {
    const rowId = document.getElementById('adm_row').value;
    let targets = [], singleGrade = '', singleGroup = '';
    if (rowId) {
      singleGrade = document.getElementById('adm_grade_hidden').value;
      singleGroup = document.getElementById('adm_group_hidden').value;
    } else {
      const gList = [...document.querySelectorAll('.adm-g:checked')].map(i => i.value);
      const bList = [...document.querySelectorAll('.adm-b:checked')].map(i => i.value);
      if (!gList.length || !bList.length) { alert("학년과 반을 각각 최소 하나씩 선택해주세요."); return; }
      gList.forEach(g => bList.forEach(b => targets.push({ grade: g, group: b })));
    }
    toggleLoading(true, "설정 저장 중...");
    callApi('addClass', { adminPw: MASTER_PW, classInfo: {
      row: rowId,
      name: document.getElementById('adm_name').value,
      desc: document.getElementById('adm_desc').value,
      ex: document.getElementById('adm_ex').value,
      popup: document.getElementById('adm_popup').value,
      status: '', targetClasses: targets, grade: singleGrade, group: singleGroup,
    }}).then(() => {
      alert("성공적으로 저장되었습니다.");
      resetAdminForm(); loadAdminList(); updateClassList(); toggleLoading(false);
    }).catch(err => { alert(err.message); toggleLoading(false); });
  }

  function delAdminClass(r) {
    if (!confirm("정말로 삭제하시겠습니까?")) return;
    toggleLoading(true);
    callApi('deleteClass', { pw: MASTER_PW, row: r }).then(() => {
      loadAdminList(); toggleLoading(false);
    }).catch(() => toggleLoading(false));
  }

  function resetAdminForm() {
    ['adm_row','adm_grade_hidden','adm_group_hidden','adm_name','adm_desc','adm_ex','adm_popup'].forEach(id => document.getElementById(id).value = '');
    document.querySelectorAll('#adm_target_area input').forEach(i => i.checked = false);
    document.getElementById('adm_target_area').classList.remove('hidden');
    document.getElementById('adm_edit_info').classList.add('hidden');
    document.getElementById('adm_cancel_btn').classList.add('hidden');
  }

  window.onload = () => { updateClassList(); setLanguage('ko'); };
</script>
</body>
</html>
